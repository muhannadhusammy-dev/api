name: Build and test TajerOS
on: [push, pull_request]
jobs:
  native-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install OCR and audio tools
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr ffmpeg
      - name: Install Python dependencies
        run: python -m pip install -r ai/requirements-runtime.txt -r llm_streamlit/requirements.txt -r requirements-dev.txt
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Build backend
        run: dotnet build backend -c Release
      - name: Dashboard regression tests
        run: python -m pytest tests/test_dashboard.py -q
      - name: Isolated business integration tests
        run: bash tests/run.sh
