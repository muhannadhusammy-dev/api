services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tajeros
      POSTGRES_USER: tajer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tajer -d tajeros"]
      interval: 5s
      retries: 10
  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    volumes: ["./data:/app/data:ro"]
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ConnectionStrings__Postgres: Host=db;Database=tajeros;Username=tajer;Password=${DB_PASSWORD}
      AI_URL: http://ai:8091
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
    ports: ["127.0.0.1:5082:8080"]
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
volumes:
  postgres:
