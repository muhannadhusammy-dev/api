ate"],"answerIndex":0,"source":"Lecture Seven","filename":"SRA - Lecture Seven Questions Bank.pdf","num":47,"page":9,"source_answer":"inferred_from_question","duplicateKey":"7d0ee98c2f24895b"},{"id":"lecture-seven-48","question":"Estimating the cost of a change happens in the ________ stage.","choices":["Problem analysis","Change analysis and costing","Change implementation","Problem identification"],"answerIndex":1,"source":"Lecture Seven","filename":"SRA - Lecture Seven Questions Bank.pdf","num":48,"page":9,"source_answer":"inferred_from_question","duplicateKey":"111a8191907f5e71"},{"id":"lecture-seven-49","question":"The decision to proceed with a change is based on its effect and:","choices":["Cost.","Popularity.","Color.","Length."],"answerIndex":0,"source":"Lecture Seven","filename":"SRA - Lecture Seven Questions Bank.pdf","num":49,"page":10,"source_answer":"inferred_from_question","duplicateKey":"490b7f546931ba3a"},{"id":"lecture-seven-50","question":"When a change is implemented, the system ________ is also modified.","choices":["Design","Budget only","Team","Office"],"answerIndex":0,"source":"Lecture Seven","filename":"SRA - Lecture Seven Questions Bank.pdf","num":50,"page":10,"source_answer":"inferred_from_question","duplicateKey":"3d623470c8d23868"},{"id":"lecture-seven-51","question":"The goal of validation is to ensure the requirements document is:","choices":["Long and detailed.","Correct and complete.","Cheap to produce.","Easy to read."],"answerIndex":1,"source":"Lecture Seven","filename":"SRA - Lecture Seven Questions Bank.pdf","num":51,"page":10,"source_answer":"inferred_from_question","duplicateKey":"ce8e5d890079021b"},{"id":"lecture-seven-52","question":"Which check would ask, \"Does this requirement make sense for the user's task?\"","choices":["Validity","Consistency","Completeness","Realism"],"answerIndex":0,"source":"Lecture Seven","filename":"SRA - Lecture Seven Questions Bank.pdf","num":52,"page":10,"source_answer":"inferred_from_question","duplicateKey":"c8d904ef8cf94bd8"},{"id":"lecture-seven-53","question":"Which check would ask, \"Do any two requirements contradict each other?\"","choices":["Validity","Consistency","Completeness","Realism"],"answerIndex":1,"source":"Lecture Seven","filename":"SRA - Lecture Seven Questions Bank.pdf","num":53,"page":10,"source_answer":"inferred_from_question","duplicateKey":"ba09fc5c52e4b995"},{"id":"lecture-seven-54","question":"Which check would ask, \"Have we covered everything the user mentioned?\"","choices":["Validity","Consistency","Completeness","Realism"],"answerIndex":2,"source":"Lecture Seven","filename":"SRA - Lecture Seven Questions Bank.pdf","num":54,"page":10,"source_answer":"inferred_from_question","duplicateKey":"81855ebd75e13a7c"},{"id":"lecture-seven-55","question":"Which check would ask, \"Can we build this with our time and money?\"","choices":["Validity","Consistency","Completeness","Realism"],"answerIndex":3,"source":"Lecture Seven","filename":"SRA - Lecture Seven Questions Bank.pdf","num":55,"page":11,"source_answer":"inferred_from_question","duplicateKey":"a6b5da551f1e8ff0"},{"id":"lecture-seven-56","question":"Which check would ask, \"How will we test if this requirement is met?\"","choices":["Verifiability","Consistency","Completeness","Realism"],"answerIndex":0,"source":"Lecture Seven","filename":"SRA - Lecture Seven Questions Bank.pdf","num":56,"page":11,"source_answer":"inferred_from_question","duplicateKey":"d055872d72d158d5"},{"id":"lecture-seven-57","question":"Writing tests early helps clarify:","choices":["The project budget.","The requirements.","The office layout.","The team's skills."],"answerIndex":1,"source":"Lecture Seven","filename":"SRA - Lecture Seven Questions Bank.pdf","num":57,"page":11,"source_answer":"inferred_from_question","duplicateKey":"f17180f60a457be5"},{"id":"lecture-six-1","question":"What does traceability in software engineering describe?","choices":["The cost of the project from start to finish.","The exten ge":2,"source_answer":"highlight","duplicateKey":"5556681fd4fc0698"},{"id":"lecture-six-6","question":"Impact analysis immediately identifies which parts need to be changed to adapt to a:","choices":["New team member.","Requested change.","Budget cut.","Tight deadline."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":6,"page":2,"source_answer":"highlight","duplicateKey":"04d6583542516dcd"},{"id":"lecture-six-7","question":"Projects are sometimes forced to retroactively recreate traceability:","choices":["At the start of a project.","At the end of a project in order to deliver.","During the testing phase.","After the product is sold."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":7,"page":3,"source_answer":"highlight","duplicateKey":"2201d76351621d86"},{"id":"lecture-six-8","question":"Retroactively creating traceability requires engineers to:","choices":["Start coding immediately.","Stop all other engineering activities.","Hire more managers.","Write user manuals."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":8,"page":3,"source_answer":"highlight","duplicateKey":"95f19285e2b412b1"},{"id":"lecture-six-9","question":"A major disadvantage of retroactive traceability is that it results in:","choices":["Higher quality code.","Unexpected supplementary expenses.","Faster delivery times.","Happier customers."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":9,"page":3,"source_answer":"highlight","duplicateKey":"ffb8869198eb3421"},{"id":"lecture-six-10","question":"Traceability allows teams to benefit from early:","choices":["Celebration.","Impact analysis.","Retirement.","Coding."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":10,"page":3,"source_answer":"highlight","duplicateKey":"142f117fc01adc27"},{"id":"lecture-six-11","question":"Requirements traceability is a tool used in project management to:","choices":["Keep track of requirements and ensure all components have similar quality and adequate testing.","Calculate developer salaries.","Design the user interface.","Write the program code."],"answerIndex":0,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":11,"page":3,"source_answer":"highlight","duplicateKey":"78f107bb37c3de8e"},{"id":"lecture-six-12","question":"If a component has requirement traceability, a software engineer can follow its life from the original requirement to the:","choices":["Project manager's notes.","Written code section and its tests.","Company's financial records.","User's personal computer."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":12,"page":3,"source_answer":"highlight","duplicateKey":"fd6efc38decdbd2a"},{"id":"lecture-six-13","question":"The forward trace verifies that requirements correspond to:","choices":["The project budget.","System components, design elements, and other deliverables.","The developer's skills.","The client's company size."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":13,"page":4,"source_answer":"highlight","duplicateKey":"c0c8f4bb663f8217"},{"id":"lecture-six-14","question":"The backward trace verifies:","choices":["The cost of each feature.","Why certain features were included in the system.","How fast a feature can be coded.","Who the project manager is."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":14,"page":4,"source_answer":"highlight","duplicateKey":"efa4d7394850691a"},{"id":"lecture-six-15","question":"A requirement with full traceability is said to have:","choices":["Forward traceability only.","Backward traceability only.","End-to-end traceability.","Partial traceability."],"answerIndex":2,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":15,"page":4,"source_answer":"highlight","duplicateKey":"9dc755c0711a9f00"},{"id":"lecture-six-16","question":"The physical form of requirements traceability is often a:","choices":["Gantt chart.","Requirements Traceability Matrix (RTM).","Pie chart.","Flowchart."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":16,"page":4,"source_answer":"highlight","duplicateKey":"cc8cf76f9f1f44b7"},{"id":"lecture-six-17","question":"An RTM demonstrates the interconnections between requirements and:","choices":["The developer's personal goals.","Business needs, other requirements, and/or deliverables.","The office layout.","The company's stock price."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":17,"page":4,"source_answer":"highlight","duplicateKey":"8a8c6fb9168f8492"},{"id":"lecture-six-18","question":"The matrix method for traceability is commonly considered appropriate for:","choices":["All projects, regardless of size.","Only government projects.","Smaller projects.","Projects without any deadlines."],"answerIndex":2,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":18,"page":4,"source_answer":"highlight","duplicateKey":"725d1e4237a0856d"},{"id":"lecture-six-19","question":"What must happen each time a requirements document is updated?","choices":["The team must have a party.","The matrix must be reviewed as well.","The code must be rewritten.","The project manager must be replaced."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":19,"page":5,"source_answer":"highlight","duplicateKey":"f95fb75faaef3ccb"},{"id":"lecture-six-20","question":"Requirements matrices are useful depending on the project's size and the level of ________ needed.","choices":["Fun","Granularity","Cost","Noise"],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":20,"page":5,"source_answer":"highlight","duplicateKey":"519fb0a4b2448a48"},{"id":"lecture-six-21","question":"For larger systems, traceability demands a solution more robust than a:","choices":["Whiteboard.","Spreadsheet.","Notebook.","PowerPoint."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":21,"page":5,"source_answer":"highlight","duplicateKey":"7db1b1cb8a0aefa5"},{"id":"lecture-six-22","question":"One benefit of requirement tracing is efficiency, which allows you to:","choices":["Track requirements in the same place for easy reference.","Work without any documentation.","Code without testing.","Ignore user feedback."],"answerIndex":0,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":22,"page":5,"source_answer":"highlight","duplicateKey":"e6b011a459410002"},{"id":"lecture-six-23","question":"Isolated component testing is possible with an RTM because it shows what code corresponds to:","choices":["The developer's name.","Specific requirements.","The project budget.","The company's history."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":23,"page":5,"source_answer":"highlight","duplicateKey":"cbc578240133b0b3"},{"id":"lecture-six-24","question":"Easier impact analysis means you can see which other parts of the project are connected to:","choices":["The manager.","Challenges or mistakes.","The best developer.","The newest computer."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":24,"page":5,"source_answer":"highlight","duplicateKey":"b95a4f889a6a349e"},{"id":"lecture-six-25","question":"Tracing requirements can help with meeting:","choices":["Personal goals.","All regulations and company policies.","The development team.","The deadline for lunch."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":25,"page":6,"source_answer":"highlight","duplicateKey":"66fcc2da024e16d4"},{"id":"lecture-six-26","question":"In some industries, there are legal requirements for recording traceability to ensure products have:","choices":["The latest features.","Well-tested and safe software.","The most code.","The best colors."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":26,"page":6,"source_answer":"highlight","duplicateKey":"e2ace0409d78213e"},{"id":"lecture-six-27","question":"Better team communication is a benefit because an RTM can update everyone about:","choices":["The company's stock price.","What has been done and what has yet to be done.","The developer's vacation plans.","The cost of coffee."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":27,"page":6,"source_answer":"highlight","duplicateKey":"503337695de8b523"},{"id":"lecture-six-28","question":"For separate development and QA departments, an RTM shows QA what tests to run and helps developers:","choices":["Locate and fix problems.","Plan their holidays.","Write more code.","Design the logo."],"answerIndex":0,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":28,"page":6,"source_answer":"highlight","duplicateKey":"07f380bf5739412d"},{"id":"lecture-six-29","question":"A characteristic of quality traceability is knowing the origin points, which includes:","choices":["The color of the code editor.","Who proposed specific requirements and when they were implemented.","The brand of the server.","The developer's favorite programming language."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":29,"page":6,"source_answer":"highlight","duplicateKey":"3b8301b10e1932d0"},{"id":"lecture-six-30","question":"Key associations in traceability refer to how requirements are:","choices":["Interrelated and how changes impact overall functionality.","Written in different languages.","Stored in different folders.","Named by different people."],"answerIndex":0,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":30,"page":6,"source_answer":"highlight","duplicateKey":"b6d617464b0cfbe1"},{"id":"lecture-six-31","question":"\"Forward and Back\" in traceability means requirements tie back to preceding ones and also:","choices":["Describe next-in-line requirements.","Are deleted if not used.","Are written in code only.","Are ignored by the team."],"answerIndex":0,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":31,"page":7,"source_answer":"highlight","duplicateKey":"18028873ddda215e"},{"id":"lecture-six-32","question":"Technical specificity in traceability includes connections to relevant code sections, their location, and:","choices":["The developer's salary.","Any critical testing performed.","The project manager's office number.","The user's age."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":32,"page":7,"source_answer":"highlight","duplicateKey":"353c0e352a986821"},{"id":"lecture-six-33","question":"Auditability in traceability provides assurances that:","choices":["The code is the shortest possible.","Stakeholder expectations have been met and no unspecified features have been added.","The project was the cheapest.","The team worked the hardest."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":33,"page":7,"source_answer":"highlight","duplicateKey":"b0efc75c9f55a7ac"},{"id":"lecture-six-34","question":"Many types of requirements management software have the function of:","choices":["Automated requirements traceability.","Writing code automatically.","Testing the software automatically.","Sending  and rooms.","Computers and printers."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":39,"page":8,"source_answer":"highlight","duplicateKey":"4dd3f06da586fcec"},{"id":"lecture-six-40","question":"The purpose of unique identifiers is to refer to a requirement ________ through the project.","choices":["Ambiguously","Unambiguously","Casually","Infrequently"],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":40,"page":8,"source_answer":"highlight","duplicateKey":"dc42740ec53fed24"},{"id":"lecture-six-41","question":"A responsible party, such as a knowledgeable analyst, must take ownership of the:","choices":["Project budget.","Traceability process.","Team building.","Coffee machine."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":41,"page":8,"source_answer":"highlight","duplicateKey":"c496792b3a42dca4"},{"id":"lecture-six-42","question":"Gathering and managing traceability data must be the explicit responsibility of:","choices":["Everyone.","Certain individuals.","No one.","The client."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":42,"page":8,"source_answer":"highlight","duplicateKey":"8e7928d0977d4260"},{"id":"lecture-six-43","question":"The analyst must practice consistency in updates, which requires ________ on the part of those making changes.","choices":["Discipline","Creativity","Laziness","Forgetfulness"],"answerIndex":0,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":43,"page":9,"source_answer":"highlight","duplicateKey":"ebf5baad4bb0421d"},{"id":"lecture-six-44","question":"When tracing all requirements is time-prohibitive, the analyst may be selective based on:","choices":["The developer's preference.","The color of the requirement.","Cost.","The day of the week."],"answerIndex":2,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":44,"page":9,"source_answer":"highlight","duplicateKey":"423bb6a155f4b35d"},{"id":"lecture-six-45","question":"Value-based requirement tracing focuses on the ________ requirements.","choices":["Most important","Easiest","Most recent","Longest"],"answerIndex":0,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":45,"page":9,"source_answer":"highlight","duplicateKey":"f4aad1c4f21f31dc"},{"id":"lecture-six-46","question":"An organization should adopt consistent practices in requirements management, including traceability, by creating an:","choices":["Organizational policy on traceability.","Annual party.","New department.","Expensive software tool."],"answerIndex":0,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":46,"page":9,"source_answer":"highlight","duplicateKey":"2cdc84aa4c85b860"},{"id":"lecture-six-47","question":"The first step in effectively tracing requirements is to understand goals and choose a:","choices":["Team.","Format.","Programing language.","Code editor."],"answerIndex":1,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":47,"page":9,"source_answer":"highlight","duplicateKey":"2f10adb64eb8ce6c"},{"id":"lecture-six-48","question":"The most common type of traceability matrix is:","choices":["Forward tracing matrix.","Backward tracing matrix.","Bidirectional traceability matrix.","No matrix at all."],"answerIndex":2,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.pdf","num":48,"page":9,"source_answer":"highlight","duplicateKey":"b46c83c1adcb6122"},{"id":"lecture-six-49","question":"A forward tracing matrix is useful for understanding which ________ are linked to which requirements.","choices":["Coding sections","Developers","Offices","Budget items"],"answerIndex":0,"source":"Lecture Six","filename":"SRA - Lecture Six Questions Bank - Solved.p  interview, the interviewer should:","choices":["Forget the details to avoid bias.","Organize the information and confirm results with the interviewees as soon as possible.","Immediately start implementing the requirements.","Share the raw notes with all project stakeholders."],"answerIndex":1,"source":"Lecture Three","filename":"SRA - Lecture Three Questions Bank - Solved.pdf","num":22,"page":5,"source_answer":"highlight","duplicateKey":"cbd40e0035fa2cac"},{"id":"lecture-three-23","question":"Which is a benefit of the interview technique?","choices":["It requires no time to plan.","It ensures no training is needed.","Interactive discussion with stakeholders.","It guarantees 100% participant adherence."],"answerIndex":2,"source":"Lecture Three","filename":"SRA - Lecture Three Questions Bank - Solved.pdf","num":23,"page":5,"source_answer":"highlight","duplicateKey":"33e9bab271c268ef"},{"id":"lecture-three-24","question":"A benefit of interviews is the immediate follow-up to ensure:","choices":["The stakeholder's coding skills.","The interviewer's understanding.","The project's budget.","The final delivery date."],"answerIndex":1,"source":"Lecture Three","filename":"SRA - Lecture Three Questions Bank - Solved.pdf","num":24,"page":5,"source_answer":"highlight","duplicateKey":"c34804802035a78d"},{"id":"lecture-three-25","question":"Interviews help build relationships by establishing:","choices":["Formal contracts.","Familiarity with the stakeholder.","A strict hierarchy.","Detailed Gantt charts."],"answerIndex":1,"source":"Lecture Three","filename":"SRA - Lecture Three Questions Bank - Solved.pdf","num":25,"page":6,"source_answer":"highlight","duplicateKey":"b9672b1bcd71bd8b"},{"id":"lecture-three-26","question":"A drawback of interviews is that they:","choices":["Require no planning.","Discourage participation.","Require time to plan and conduct.","Never build relationships."],"answerIndex":2,"source":"Lecture Three","filename":"SRA - Lecture Three Questions Bank - Sol $('app').addEventListener('input',evt=>{if(evt.target.id==='search'){state.search=evt.target.value;state.cursorId=null;const caret=evt.target.selectionStart;render({focus:'search',caret})}});
$('app').addEventListener('change',evt=>{if(evt.target.id==='unique'){state.unique=evt.target.checked;state.cursorId=null;render()}if(evt.target.id==='examLimit'){state.examLimit=evt.target.value;}if(evt.target.id==='importer'){const file=evt.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const o=JSON.parse(reader.result);if(o.format!=='SRA_SWE131')throw Error('Incorrect file format');state.answers=o.answers||{};state.checked=o.checked||{};state.flags=o.flags||{};render();alert('Progress imported successfully.')}catch(err){alert('Could not import: '+err.message)}};reader.readAsText(file)}});
document.addEventListener('keydown',evt=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(evt.altKey||evt.ctrlKey||evt.metaKey)return;if(evt.key==='ArrowLeft')changePos(-1);if(evt.key==='ArrowRight')changePos(1)});
render();
</script></body></html>
