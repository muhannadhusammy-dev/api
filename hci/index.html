"],"answerIndex":0,"source":"Lecture 4 – Model Answers","filename":"HCI Lecture 4 Questions with Answers.pdf","num":34,"source_answer":"explicit_answer_pdf","duplicateKey":"4d6711b0ae2e"},{"id":"hci-l4a-35","question":"Point and click interfaces are commonly used in:","choices":["Command line terminals","Web browsers and hypertext","Industrial batch systems","Machine code compilers"],"answerIndex":1,"source":"Lecture 4 – Model Answers","filename":"HCI Lecture 4 Questions with Answers.pdf","num":35,"source_answer":"explicit_answer_pdf","duplicateKey":"dfa3454dee50"},{"id":"hci-l4a-36","question":"In 3D interfaces, depth cues are often provided by:","choices":["High text density","Light and occlusion","Sound effects only","Fast cursor movement"],"answerIndex":1,"source":"Lecture 4 – Model Answers","filename":"HCI Lecture 4 Questions with Answers.pdf","num":36,"source_answer":"explicit_answer_pdf","duplicateKey":"38a266a89653"},{"id":"hci-l4a-37","question":"Windows that are laid out next to one another without overlapping are called:","choices":["Cascaded","Tiled","Pop-up","Iconised"],"answerIndex":1,"source":"Lecture 4 – Model Answers","filename":"HCI Lecture 4 Questions with Answers.pdf","num":37,"source_answer":"explicit_answer_pdf","duplicateKey":"95dfc1696a8b"},{"id":"hci-l4a-38","question":"Scrollbars in a window allow the user to:","choices":["Change screen resolution","Move window contents up/down or side to side","Close the window","Edit icon graphics"],"answerIndex":1,"source":"Lecture 4 – Model Answers","filename":"HCI Lecture 4 Questions with Answers.pdf","num":38,"source_answer":"explicit_answer_pdf","duplicateKey":"a31b6a06f482"},{"id":"hci-l4a-39","question":"An icon in a WIMP interface is a small picture that represents:","choices":["An object, window, or action","The CPU clock speed","Network signal strength","The monitor aspect ratio"],"answerIndex":0,"source":"Lecture 4 – Model Answers","filename":"HCI Lecture 4 Questions with Answers.pdf","num":39,"source_answer":"explicit_answer_pdf","duplicateKey":"ecaf43d91c03"},{"id":"hci-l4a-40","question":"Which menu type appears on screen only when needed or requested by the user?","choices":["Permanent menu bar","Pop-up menu","Tiled menu","Static form menu"],"answerIndex":1,"source":"Lecture 4 – Model Answers","filename":"HCI Lecture 4 Questions with Answers.pdf","num":40,"source_answer":"explicit_answer_pdf","duplicateKey":"713224352928"},{"id":"hci-l4a-41","question":"Menus arranged in a circular format are called:","choices":["Pull-down menus","Pie menus","Cascading menus","Fall-down menus"],"answerIndex":1,"source":"Lecture 4 – Model Answers","filename":"HCI Lecture 4 Questions with Answers.pdf","num":41,"source_answer":"explicit_answer_pdf","duplicateKey":"706beaf0ff63"},{"id":"hci-l4a-42","question":"Key combinations that produce the same effect as selecting a menu item are:","choices":["Radio buttons","Keyboard accelerators","Scroll keys","Window titles"],"answerIndex":1,"source":"Lecture 4 – Model Answers","filename":"HCI Lecture 4 Questions with Answers.pdf","num":42,"source_answer":"explicit_answer_pdf","duplicateKey":"737bd75945fa"},{"id":"hci-l4a-43","question":"Radio buttons are used for:","choices":["Mutually exclusive choices","Non-exclusive choices","Free text entry","Window resizing"],"answerIndex":0,"source":"Lecture 4 – Model Answers","filename":"HCI Lecture 4 Questions with Answers.pdf","num":43,"source_answer":"explicit_answer_pdf","duplicateKey":"2331646f01de"},{"id":"hci-l4a-44","question":"Check boxes are used for:","choices":["Mutually exclusive choices","Non-exclusive choices","Executing command scripts","System rebooting"],"answerIndex":1,"source":"Lecture 4 – Model Answers","filename":"HCI Lecture 4 Questions with Answers.pdf","num":44,"source_answer":"explicit_answer_pdf","duplicateKey":"4ce905c0a1ba"},{"id":"hci-l4a-45","question":"Toolbars are long lines of icons that provide:","choices":["Fast access to common actions","Text editing fun nly","Graphics co-processor choice"],"answerIndex":0,"source":"Lecture 4 – Model Answers","filename":"HCI Lecture 4 Questions with Answers.pdf","num":50,"source_answer":"explicit_answer_pdf","duplicateKey":"1c98015845aa"}]};
const ALL=BANK.questions;
const LETTERS=['A','B','C','D'];
const STORE='hci-448-quiz-v1';
const safeGet=()=>{try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){return {}}};
const initial=safeGet();
const state={mode:'practice',source:initial.source||'all',unique:initial.unique??true,filter:initial.filter||'all',search:'',cursorId:initial.cursorId||null,answers:initial.answers||{},checked:initial.checked||{},flags:initial.flags||{},shuffleMap:null,examLimit:60,exam:null,examReview:'all',notice:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const nfmt=n=>Number(n||0).toLocaleString('en-US');
function save(){try{localStorage.setItem(STORE,JSON.stringify({source:state.source,unique:state.unique,filter:state.filter,cursorId:state.cursorId,answers:state.answers,checked:state.checked,flags:state.flags}))}catch(e){}}
function canonical(arr){if(!state.unique)return arr;const seen=new Set();return arr.filter(q=>{if(seen.has(q.duplicateKey))return false;seen.add(q.duplicateKey);return true})}
function basePool(){return canonical(ALL.filter(q=>state.source==='all'||q.source===state.source))}
function isWrong(q){return !!state.checked[q.id]&&state.answers[q.id]!==q.answerIndex}
function stats(pool){let attempted=0,correct=0;pool.forEach(q=>{if(state.checked[q.id]){attempted++;if(state.answers[q.id]===q.answerIndex)correct++}});return {attempted,correct,wrong:attempted-correct,total:pool.length,accuracy:attempted?Math.round(correct*100/attempted):0}}
function filtered(){let out=basePool().filter(q=>{const c=!!state.checked[q.id];switch(state.filter){case 'unanswered':if(c)return false;break;case 'wrong':if(!isWrong(q))return false;break;case 'correct':if(!c||isWrong(q))return false;break;case 'flagged':if(!state.flags[q.id])return false;break}return !state.search||(q.question+' '+q.choices.join(' ')+' '+q.num).toLowerCase().includes(state.search.toLowerCase())});if(state.shuffleMap)out.sort((a,b)=>(state.shuffleMap[a.id]??1e6)-(state.shuffleMap[b.id]??1e6));return out}
function chooseCurrent(arr){let i=arr.findIndex(q=>q.id===state.cursorId);if(i<0){i=0;if(arr.length)state.cursorId=arr[0].id}return {q:arr[i],index:i}}
function sourcesHTML(){let items=[{name:'all',label:'All question banks',count:ALL.length},...BANK.sources.map(s=>({name:s.name,label:s.name,count:s.count}))];return items.map(s=>`<button class="source-option ${state.source===s.name?'on':''}" data-action="source" data-value="${esc(s.name)}"><span>${esc(s.label)}</span><span class="count">${s.count}</span></button>`).join('')}
function filterHTML(){return [['all','All'],['unanswered','Not checked'],['wrong','Incorrect'],['correct','Correct'],['flagged','Flagged']].map(([k,v])=>`<button class="small-filter ${state.filter===k?'on':''}" data-action="filter" data-value="${k}">${v}</button>`).join('')}
function sidebar(){return `<aside class="sidebar panel pad">
<div class="side-heading">Quiz mode</div><div class="seg"><button data-action="mode" data-value="practice" class="${state.mode==='practice'?'on':''}">Practice</button><button data-action="mode" data-value="exam" class="${state.mode==='exam'?'on':''}">Exam</button></div>
<div class="side-heading">Select source</div><div class="source-list">${sourcesHTML()}</div>
<div class="divider"></div><div class="side-heading">Study controls</div>
<input class="control-input" id="search" type="search" placeholder="Search question or keywords…" value="${esc(state.search)}" autocomplete="off" aria-label="Search questions">
<label class="checkline"><input type="checkbox" id="unique" ${state.unique?'checked':''}> Hide identical duplicates</label>
${state.mode==='practice'?`<div class="divider"></div><div class="side-heading">Filter by progress</div><div class="filter-stack">${filterHTML()}</div><div style="margin-top:12px"><button class="btn compact" data-action="shuffle">Shuffle questions</button></div>`:''}
<div class="divider"></div><div class="side-heading">Your data</div><button class="btn compact" data-action="export">Export progress</button> <button class="btn compact" data-action="import">Import</button> <button class="btn compact" data-action="reset">Reset progress</button><input id="importer" type="file" accept=".json,application/json" hidden>
<p class="note">Progress saves in this browser.</p>
</aside>`}
function headline(){let s=stats(basePool());return `<div class="stat-row">
<div class="stat"><div class="caption">Available questions</div><div class="value">${nfmt(s.total)}</div></div>
<div class="stat"><div class="caption">Checked answers</div><div class="value">${nfmt(s.attempted)}</div></div>
<div class="stat good"><div class="caption">Correct answers</div><div class="value">${nfmt(s.correct)}</div></div>
<div class="stat bad"><div class="caption">Incorrect answers</div><div class="value">${nfmt(s.wrong)}</div></div></div>`}
function answerOrigin(q){if(q.source_answer==='inferred_from_question')return 'Answer from supplied PDF.';if(q.source_answer==='derived_no_highlight')return 'No answer was highlighted in the PDF; the answer was determined from the document content.';if(q.source_answer==='matched_solved_bank'||q.source_answer==='matched_synonym')return 'Answer cross-checked against the corresponding solved question bank.';return 'Answer taken from the PDF solution or highlighted choice.'}
function formatChoice(q,i,selected,show,locked){const right=i===q.answerIndex;const wrong=show&&selected===i&&!right;return `<button class="choice ${selected===i?'selected':''} ${show&&right?'right':''} ${wrong?'wrong':''}" data-action="choose" data-value="${i}" ${locked?'disabled':''} aria-pressed="${selected===i}"><span class="letter">${LETTERS[i]}</span><span class="choice-text">${esc(q.choices[i])}</span><span class="mark">${show&&right?'✓':wrong?'✕':''}</span></button>`}
function feedback(q,selected){const correct=selected===q.answerIndex;return `<div class="feedback ${correct?'':'bad'}" role="status"><strong>${correct?'Correct!':'Incorrect.'}</strong> Answer: <b>${LETTERS[q.answerIndex]}. ${esc(q.choices[q.answerIndex])}</b></div>`}

function navigator(arr,index,exam=false){const n=arr.length;if(!n)return '';let from=Math.max(0,index-22),to=Math.min(n,from+46);from=Math.max(0,to-46);
let nums=arr.slice(from,to).map((q,j)=>{const p=from+j;const seen=exam?state.exam?.answers?.[q.id]!==undefined:state.checked[q.id];const good=!exam&&seen&&!isWrong(q),bad=!exam&&isWrong(q);return `<button class="number ${p===index?'active':''} ${good?'correct':''} ${bad?'incorrect':''} ${exam&&seen?'answered':''} ${state.flags[q.id]?'flagged':''}" title="${esc(q.source)} – Question ${q.num}" data-action="jump" data-value="${p}">${p+1}</button>`}).join('');return `<section class="panel navigator"><div class="section-line"><h3>Question navigator</h3><span class="fine">${from+1}–${to} of ${n} · ${exam?'Blue = answered during exam':'Green = correct, red = incorrect'}</span></div><div class="number-grid">${nums}</div><div class="question-find">Jump to number <input id="jumpInput" class="control-input" type="number" min="1" max="${n}" placeholder="1–${n}"> <button class="btn compact" data-action="gojump">Go</button></div></section>`}
function practiceView(){const arr=filtered(),st=stats(basePool());if(!arr.length)return `<section class="panel empty"><h2>No questions in this view</h2><p>Change the filter or source to see more questions.</p><button class="btn primary" data-action="clearfilters">Show all questions</button></section>`;const {q,index}=chooseCurrent(arr);const selected=state.answers[q.id];const done=!!state.checked[q.id];
return `<section class="card"><header class="card-head"><div class="meta"><span class="tag">${esc(q.source)}</span><span class="tag subtle">Original Q${q.num}</span>${state.flags[q.id]?'<span class="tag review">Flagged for review</span>':''}</div><h2 class="card-title">${esc(q.question)}</h2><div class="q-progress"><span>Question <b>${index+1}</b> of <b>${arr.length}</b></span><span>${st.attempted} checked · ${st.accuracy}% accuracy</span></div><div class="bar"><div class="bar-fill" style="width:${Math.max(0,Math.min(100,100*st.attempted/(st.total||1)))}%"></div></div></header>
<div class="card-body"><div class="choices">${q.choices.map((ch,i)=>formatChoice(q,i,selected,done,done)).join('')}</div>${done?feedback(q,selected):''}
<div class="action-row"><div class="nav-wrap"><button class="btn" data-action="prev" ${index===0?'disabled':''}>← Previous</button><button class="btn" data-action="next" ${index===arr.length-1?'disabled':''}>Next →</button></div><div class="nav-wrap"><button class="btn ${state.flags[q.id]?'orange':''}" data-action="flag">${state.flags[q.id]?'Unflag':'Flag for review'}</button>${!done?`<button class="btn primary" data-action="check" ${selected===undefined?'disabled':''}>Check answer</button>`:`<button class="btn" data-action="clearanswer">Try again</button>`}</div></div>
</div></section>${navigator(arr,index)}`}
function examView(){if(!state.exam)return `<section class="panel setup"><span class="tag">Exam mode</span><h2 style="margin-top:12px">Build your practice exam</h2><p>Questions are presented without immediate feedback. Your score and the correct answers appear when you submit the exam.</p>
<div class="setup-grid"><label class="field">Number of questions<select class="control-input" id="examLimit">${[20,40,60,100,'all'].map(x=>`<option value="${x}" ${state.examLimit===x?'selected':''}>${x==='all'?'All available questions':x+' questions'}</option>`).join('')}</select></label></div>
<div class="reminder">The selected source determines which questions can appear. When mixing all sources, the exam draws from every bank. If your selection has fewer questions than requested, all available questions are used.</div>
<div style="margin-top:20px"><button class="btn primary" data-action="startexam">Start exam</button></div></section>`;
const e=state.exam;const arr=e.questions.map(id=>ALL.find(q=>q.id===id)).filter(Boolean);
if(e.finished&&e.showSummary!==false){const n=arr.length,answered=arr.filter(q=>e.answers[q.id]!==undefined).length,correct=arr.filter(q=>e.answers[q.id]===q.answerIndex).length;const pct=n?Math.round(correct/n*100):0;return `<section class="panel results"><span class="tag">Exam completed</span><h2 style="margin-top:13px">Your exam results</h2><div class="scoreBig">${pct}%</div><p>You answered <b>${answered}</b> of ${n} questions. <b>${correct}</b> correct and <b>${n-correct}</b> incorrect or unanswered.</p><div class="bar" style="max-width:580px;margin:16px 0"><div class="bar-fill" style="width:${pct}%"></div></div><div class="result-actions"><button class="btn primary" data-action="reviewexam">Review answers</button><button class="btn" data-action="reviewwrong">Review mistakes</button><button class="btn" data-action="newexam">Start a new exam</button></div></section>`}
let view=arr; if(e.finished&&state.examReview==='wrong')view=arr.filter(q=>e.answers[q.id]!==q.answerIndex);
if(view.length===0)return `<section class="panel empty"><h2>Nothing to review</h2><p>You did not miss any questions.</p><button class="btn" data-action="examsummary">View results</button></section>`;
const idx=Math.min(Math.max(0,e.current||0),view.length-1);e.current=idx;const q=view[idx],selected=e.answers[q.id],show=e.finished;
const ans=arr.filter(q=>e.answers[q.id]!==undefined).length;
return `<div class="exam-banner"><span>${e.finished?'Exam review — answers are now visible':'Exam in progress — feedback is hidden until submission'} · ${ans}/${arr.length} answered</span>${e.finished?`<button class="btn compact" data-action="examsummary">Results</button>`:`<button class="btn compact orange" data-action="submitexam">Submit exam</button>`}</div>
<section class="card"><header class="card-head"><div class="meta"><span class="tag">${esc(q.source)}</span><span class="tag subtle">Original Q${q.num}</span></div><h2 class="card-title">${esc(q.question)}</h2><div class="q-progress"><span>Question <b>${idx+1}</b> of <b>${view.length}</b></span><span>${ans} selected</span></div><div class="bar"><div class="bar-fill" style="width:${100*ans/(arr.length||1)}%"></div></div></header><div class="card-body"><div class="choices">${q.choices.map((c,i)=>formatChoice(q,i,selected,show,show)).join('')}</div>${show?feedback(q,selected):''}<div class="action-row"><div class="nav-wrap"><button class="btn" data-action="prev" ${idx===0?'disabled':''}>← Previous</button><button class="btn" data-action="next" ${idx===view.length-1?'disabled':''}>Next →</button></div><div class="nav-wrap"><button class="btn ${state.flags[q.id]?'orange':''}" data-action="flag">${state.flags[q.id]?'Unflag':'Flag'}</button>${e.finished?'<button class="btn primary" data-action="examsummary">View results</button>':`<button class="btn primary" data-action="submitexam">Finish exam</button>`}</div></div></div></section>${navigator(view,idx,true)}`}
function render(opts={}){const app=$('app');const keepFocus=opts.focus;const top=`<main class="shell"><header class="top"><div class="brand"><div class="brand-symbol">HCI</div><div class="brand-copy"><strong>Human-Computer Interaction</strong><span>Mansoura University · HCI · Semester 1</span></div></div><div class="top-actions"><span class="pill">Offline-ready</span><span class="pill">Answers from PDFs</span></div></header>
<section class="hero"><div><div class="eyebrow">COMPLETE EXAM PREPARATION</div><h1>All your HCI questions,<br>one interactive quiz.</h1><p>Choose an answer, check it instantly, or take a timed-free exam. No explanations, just the correct answers.</p></div><div class="hero-metrics"><div><strong>${ALL.length}</strong><span>Questions</span></div><div><strong>${new Set(ALL.map(q=>q.duplicateKey)).size}</strong><span>Non-identical entries</span></div><div><strong>${BANK.sources.length}</strong><span>Question sets</span></div></div></section><div class="layout">${sidebar()}<div class="main">${state.mode==='practice'?headline()+practiceView():examView()}<footer class="footer">Built from your 10 uploaded HCI PDFs · No account or internet connection required</footer></div></div></main>`;app.innerHTML=top;save();if(keepFocus){const el=$(keepFocus);if(el){el.focus();if(el.setSelectionRange&&opts.caret!==undefined)try{el.setSelectionRange(opts.caret,opts.caret)}catch(e){}}}}
function currentList(){if(state.mode==='practice'){let arr=filtered();let i=arr.findIndex(q=>q.id===state.cursorId);return {arr,index:Math.max(0,i),q:arr[Math.max(0,i)]}}const e=state.exam;if(!e)return {arr:[],index:0,q:null};let arr=e.questions.map(id=>ALL.find(q=>q.id===id)).filter(Boolean);if(e.finished&&state.examReview==='wrong')arr=arr.filter(q=>e.answers[q.id]!==q.answerIndex);let i=Math.min(Math.max(0,e.current||0),arr.length-1);return {arr,index:i,q:arr[i]}}
function changePos(delta){const {arr,index}=currentList();if(!arr.length)return;let next=Math.max(0,Math.min(arr.length-1,index+delta));if(state.mode==='practice')state.cursorId=arr[next].id;else state.exam.current=next;render();window.scrollTo({top:0,behavior:'smooth'})}
function examStart(){let pool=basePool().filter(q=>!state.search||(q.question+' '+q.choices.join(' ')).toLowerCase().includes(state.search.toLowerCase()));if(!pool.length){alert('No questions match your source and search filters.');return}for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}let number=state.examLimit==='all'?pool.length:Math.min(Number(state.examLimit),pool.length);state.exam={questions:pool.slice(0,number).map(q=>q.id),answers:{},finished:false,current:0,showSummary:false};state.examReview='all';render()}
function resetEverything(){if(!confirm('Clear all saved practice answers and flags? This cannot be undone.'))return;state.answers={};state.checked={};state.flags={};state.cursorId=null;state.shuffleMap=null;render()}
function exportProgress(){const blob=new Blob([JSON.stringify({format:'HCI_FULL_QUIZ',version:1,date:new Date().toISOString(),answers:state.answers,checked:state.checked,flags:state.flags},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='HCI_FULL_QUIZ_Quiz_Progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
$('app').addEventListener('click',function(evt){const b=evt.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,value=b.dataset.value;const cur=currentList(),q=cur.q;
switch(action){
case 'mode':if(state.mode==='exam'&&state.exam&&!state.exam.finished&&!confirm('Leave the active exam? Unsaved exam answers will be lost.'))return;state.mode=value;state.exam=null;state.examReview='all';break;
case 'source':if(state.mode==='exam'&&state.exam&&!state.exam.finished&&!confirm('Changing sources will restart the active exam.'))return;state.source=value;state.cursorId=null;state.exam=null;state.shuffleMap=null;break;
case 'filter':state.filter=value;state.cursorId=null;break;
case 'shuffle':{const pool=basePool().slice();for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}state.shuffleMap=Object.fromEntries(pool.map((p,i)=>[p.id,i]));state.cursorId=null;break}
case 'clearfilters':state.filter='all';state.source='all';state.search='';state.cursorId=null;break;
case 'choose':if(!q)return;if(state.mode==='practice'){if(state.checked[q.id])return;state.answers[q.id]=Number(value)}else if(state.exam&&!state.exam.finished)state.exam.answers[q.id]=Number(value);break;
case 'check':if(q&&state.answers[q.id]!==undefined)state.checked[q.id]=true;break;
case 'clearanswer':if(q){delete state.answers[q.id];delete state.checked[q.id]}break;
case 'flag':if(q)state.flags[q.id]=!state.flags[q.id];break;
case 'prev':changePos(-1);return;
case 'next':changePos(1);return;
case 'jump':{const next=Number(value);const arr=cur.arr;if(arr[next]){if(state.mode==='practice')state.cursorId=arr[next].id;else state.exam.current=next}break}
case 'gojump':{const n=Number($('jumpInput')?.value||0)-1;if(cur.arr[n]){if(state.mode==='practice')state.cursorId=cur.arr[n].id;else state.exam.current=n}else{alert('Enter a question number in the displayed range.');return}break}
case 'reset':resetEverything();return;
case 'export':exportProgress();return;
case 'import':$('importer').click();return;
case 'startexam':examStart();return;
case 'submitexam':{if(!state.exam)return;const n=state.exam.questions.length;const done=Object.keys(state.exam.answers).length;if(!confirm(`Submit exam? You have answered ${done} of ${n} questions.`))return;state.exam.finished=true;state.exam.showSummary=true;break}
case 'examsummary':state.exam.showSummary=true;break;
case 'reviewexam':state.exam.showSummary=false;state.examReview='all';state.exam.current=0;break;
case 'reviewwrong':state.exam.showSummary=false;state.examReview='wrong';state.exam.current=0;break;
case 'newexam':state.exam=null;break;
}
render();
});
$('app').addEventListener('input',evt=>{if(evt.target.id==='search'){state.search=evt.target.value;state.cursorId=null;const caret=evt.target.selectionStart;render({focus:'search',caret})}});
$('app').addEventListener('change',evt=>{if(evt.target.id==='unique'){state.unique=evt.target.checked;state.cursorId=null;render()}if(evt.target.id==='examLimit'){state.examLimit=evt.target.value;}if(evt.target.id==='importer'){const file=evt.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const o=JSON.parse(reader.result);if(o.format!=='HCI_FULL_QUIZ')throw Error('Incorrect file format');state.answers=o.answers||{};state.checked=o.checked||{};state.flags=o.flags||{};render();alert('Progress imported successfully.')}catch(err){alert('Could not import: '+err.message)}};reader.readAsText(file)}});
document.addEventListener('keydown',evt=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(evt.altKey||evt.ctrlKey||evt.metaKey)return;if(evt.key==='ArrowLeft')changePos(-1);if(evt.key==='ArrowRight')changePos(1)});
render();
</script></body></html>
